name: Kitchen Buddy recipe image pack
on:
  push:
    branches: [feature/recipe-library-real-photos]
    paths:
      - ".github/workflows/kitchen-buddy-photo-pack.yml"
      - "preview-1-2/build_recipe_photos.py"
      - "preview-1-2/photo-sources.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kitchen-buddy-photo-pack
  cancel-in-progress: false

jobs:
  bundle-food-photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install photo tools
        run: python -m pip install "Pillow>=11,<13"
      - name: Download and resize recipe photography
        run: python preview-1-2/build_recipe_photos.py
      - name: Save recipe photo files on review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-1-2/assets/recipes/*.webp preview-1-2/photo-download-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Bundle optimized Kitchen Buddy recipe photography"
            # The review branch may have advanced while photos were downloading.
            # Rebase our image-only commit onto the newest branch head; never force-push.
            git fetch origin feature/recipe-library-real-photos
            git rebase origin/feature/recipe-library-real-photos
            git push origin HEAD:feature/recipe-library-real-photos
          fi
