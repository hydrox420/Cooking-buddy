name: Kitchen Buddy recipe health audit test
on:
  pull_request:
    branches: [main]
    paths:
      - "health-curation.js"
      - "index.html"
      - "library-rows-v2.js"
      - "root-smoke-test.cjs"
      - ".github/workflows/kitchen-buddy-health-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health-curation-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test curated root app, planning, archive and reload
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node root-smoke-test.cjs
