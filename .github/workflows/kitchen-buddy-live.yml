name: Kitchen Buddy live app smoke test
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "buddy-v2.js"
      - "forest-cabin.css"
      - "library-rows-v2.js"
      - "ui-polish.js"
      - "assets/**"
      - "root-smoke-test.cjs"
      - ".github/workflows/kitchen-buddy-live.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual live app and saved data preservation
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node root-smoke-test.cjs
