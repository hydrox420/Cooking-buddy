name: Build Health Buddy Test APK
on:
  push:
    branches:
      - health-connect-read-test-20261018
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: healthbuddy
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HealthBuddyConnectionTest-APK
          path: healthbuddy/app/build/outputs/apk/debug/app-debug.apk
