name: Kitchen Buddy mobile layout smoke test
on:
  push:
    branches: [main]
    paths:
      - "layout-test/**"
      - ".github/workflows/kitchen-buddy-layout-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mobile browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test isolated Kitchen Buddy layout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          sleep 3
          node layout-test/smoke-test.cjs
          node layout-test/flow-smoke-test.cjs
